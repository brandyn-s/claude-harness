skill: gather-claude-endpoints
name: gather-claude-endpoints deterministic invariants
trigger: /gather-claude-endpoints [scope]
must_happen:
- Baseline is loaded from the dedicated KB before any diff is graded
- diff_channels.py is run (drift is detected mechanically, not by re-reading prose)
- INSTRUMENT_BLIND and CHANNEL_DEAD are treated as detector/page failures, never as vendor removals
- Every finding is PROBED against the live API and against our own codebase before grading
- An impact claim about OUR system cites a grep or file:line, never vendor docs alone
- The code probe greps the FIELD NAME across EVERY repo, never one expected module
- Before recommending "ingest and alert on X", the probe checks whether a guard already exists
- A blocked probe surfaces the blocker to the user; it never silently degrades to doc-inference
- Severity is re-graded AFTER probing (the probe usually downgrades it)
- Every finding carries exactly one verdict from ADOPT/TRIAL/DEFER/REJECT
- Baselines are refreshed only AFTER drift is graded
- Nothing is auto-written except baseline files
- Step 2c reads a plain JSON inventory (an object of baseline-key to value list) and/or runs Keychain-keyed GET probes; nothing in the skill queries a data store
- A missing Keychain key reports SKIPPED_NO_KEY (an instrument gap), never "unreachable"
deterministic:
- frontmatter_equals:
    name: gather-claude-endpoints
- body_contains:
  # detection layer
  - INSTRUMENT_BLIND
  - CHANNEL_DEAD
  - NO_BASELINE
  - diff_channels.py
  - claude-data-channels
  # probe layer (added v1.1 -- the first run shipped 2 unprobed findings)
  - 'Step 4b'
  - API probe
  - Code probe
  - Severity basis
  - UNVERIFIED-BLOCKED
  - downgraded-by-probe
  - Silent clamps
  - FIELD NAME
  - Never scope to one module
  - Verdict
  - Worked example
  # observed leg (Step 2c) -- a file contract replaced the data-store query leg 2026-09-04
  - '--observed'
  - UNDOCUMENTED
  - DOC_ONLY
  - SKIPPED_NO_KEY
  - UnsafeProbe
- body_not_contains:
  - Athena
- script_exists: scripts/reconcile_observed.py
- script_runs: python3 scripts/reconcile_observed.py --help
- references_resolve: true
- examples_count: '>=2'
