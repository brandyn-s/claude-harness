id: code-explore
type: skill
description: "Find code by meaning or understand how something works. Routes to code-search for conceptual queries and auto-chains with code-graph."
category: code-intel
requires_tools:
  - Read
  - mcp__code-graph__detect_changes
  - mcp__code-graph__get_architecture
  - mcp__code-graph__get_code_snippet
  - mcp__code-graph__get_graph_schema
  - mcp__code-graph__list_projects
  - mcp__code-graph__query_graph
  - mcp__code-graph__query_security_surfaces
  - mcp__code-graph__code_localize
  - mcp__code-search__search_code
  - mcp__code-graph__search_graph
  - mcp__code-graph__trace_call_path
  - mcp__code-search__find_similar_code
  - mcp__code-graph__index_status
  - mcp__code-graph__search_code
requires_topics: []
requires_rules:
  - search-efficiency
requires_skills:
  - codebase-memory-exploring
  - evaluate-repos
requires_auth: []
input_contract:
  parameters:
    query:
      type: string
      required: false
      description: "Natural language code query"
      examples: ["where is authentication implemented", "how does the worker agent load topics"]
  scope_from: argument
output_contract:
  produces: [code_locations, call_chains, explanation]
  format: markdown_report
side_effects: [none]
execution_context: main_thread
auth_constraint: any
estimated_turns: "3-10"
preconditions:
  - repo_indexed
guardrails: []
threat_model: read_only
prose_only_tools:  # mentioned in SKILL.md prose, deliberately not used (B9/F4; reconcile-skill-tools honors this)
  - mcp__code-graph__index_repository  # Pre-flight Check step 2 — 'Do NOT attempt to call index_repository from this skill'
