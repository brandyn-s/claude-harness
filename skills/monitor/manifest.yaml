id: monitor
type: skill
description: "Start a real-time flaw tracker for the current session -- append a structured flaw entry the MOMENT a wrong assumption / bad instrument / flawed approach is discovered during execution, the in-session alternative to batching at end-of-session /distill. The standalone form of superplan's mandatory real-time-flaw-log discipline."
category: knowledge

requires_tools:
  - "Read"
  - "Write"
  - "Edit"
  - "Glob"
  - "Bash"
requires_topics: []
requires_rules: []
requires_skills: []
requires_auth: []

input_contract:
  parameters:
    work_description:
      type: string
      required: false
      description: "The work being tracked; if omitted, inferred from recent conversation"
  scope_from: argument
output_contract:
  produces: [session_flaw_log]
  format: markdown_file

side_effects: [writes_flaw_log_to_knowledge_base_plans]
execution_context: main_thread
auth_constraint: any
estimated_turns: "1-2 to start; appends throughout the session"

preconditions:
  - "~/Documents/knowledge-base/plans/ exists (else falls back to /tmp/claude/ with a note)"
guardrails: []
threat_model: writes_local
