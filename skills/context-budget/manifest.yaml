id: context-budget
type: skill
description: "Audits token overhead from loaded skills, rules, MCP tools, hooks, and CLAUDE.md, identifies bloat, and produces prioritized token-savings recommendations."
category: maintenance

requires_tools:
  - Bash
  - Read
  - Grep
  - Glob
  - AskUserQuestion
requires_topics: []
requires_rules: []
requires_skills: []
requires_auth: []

input_contract:
  parameters:
    component:
      type: string
      required: false
      description: "Optional component type to audit: skills, rules, mcp"
  scope_from: argument
output_contract:
  produces: [token_inventory, component_classification, savings_recommendations]
  format: markdown_report

side_effects: [none]
execution_context: main_thread
auth_constraint: any
estimated_turns: "5-10"

preconditions:
  - ~/.claude/ directory with skills, rules, settings.json
guardrails: []
threat_model: read_only
