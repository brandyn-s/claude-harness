  - mcp__xai__x_search_user

  # Linear (named-variant)
  - mcp__linear-server__get_status_updates
  - mcp__linear-server__save_status_update

  # Compliance access framework
  - mcp__compliance-access-framework__add_confluence_space_group
  - mcp__compliance-access-framework__assign_group_to_enterprise_app
  - mcp__compliance-access-framework__create_confluence_space
  - mcp__compliance-access-framework__create_m365_group
  - mcp__compliance-access-framework__create_scim_group
  - mcp__compliance-access-framework__create_slack_channel
  - mcp__compliance-access-framework__invite_to_workspace
  - mcp__compliance-access-framework__link_channel_to_idp_group
  - mcp__compliance-access-framework__preflight_check
  - mcp__compliance-access-framework__verify_workspace

  # Context7 docs
  - mcp__context7-docs__query-docs
  - mcp__context7-docs__resolve-library-id

  # GitHub MCP — large surface, glob pattern
  - mcp__github__*

  # UUID-namespaced variants (per-environment; treat as wildcard).
  # We accept ANY mcp__<uuid>__<tool> form as valid because the UUID
  # corresponds to a real server registration; the per-tool validation
  # would require server introspection. Pattern is a regex (curly braces
  # make _load_known_tools classify it as such); `.*` matches any tool
  # name suffix.
  - "mcp__[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}__.*"

  # Slack (named variant — same patterns as UUID-namespaced)
  - mcp__slack__*
