id: systematic-debugging
type: skill
description: "Root-cause-first debugging: gather evidence, enumerate mechanisms, form multiple hypotheses, test systematically."
category: operations
requires_tools:
  - Bash
  - Read
  - Grep
  - Agent
  - AskUserQuestion
requires_topics: []
requires_rules:
  - diagnose-before-fix
requires_skills:
  - test-driven-development
  - verification-before-completion
requires_auth: []
input_contract:
  parameters:
    symptom:
      type: string
      required: false
      description: "Error message or symptom to debug"
  scope_from: argument
output_contract:
  produces: [root_cause_analysis, hypothesis_table, fix_with_test]
  format: markdown_report
side_effects: [may_write_diagnostic_scripts]
execution_context: main_thread
auth_constraint: any
estimated_turns: "10-40"
preconditions: []
guardrails: []
threat_model: writes_local
