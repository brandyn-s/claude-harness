id: subagent-driven-development
type: skill
description: "Execute implementation plans with fresh subagents and bounded, risk-based review."
category: operations
requires_tools:
  - Agent
  - AskUserQuestion
  - Bash
  - Read
  - TaskCreate
  - TaskUpdate
requires_topics: []
requires_rules:
  - subagent-verification
requires_skills:
  - test-driven-development
  - ship
requires_auth: []
input_contract:
  parameters:
    task:
      type: string
      required: false
      description: "Task description or plan file reference"
  scope_from: argument
output_contract:
  produces: [implemented_code, review_results, commit_shas]
  format: git_commits
side_effects: [writes_files, creates_commits]
execution_context: main_thread
auth_constraint: main_thread_only
estimated_turns: "8-30"
preconditions:
  - implementation_plan_exists
guardrails:
  - bash-security-guard
threat_model: writes_local
prose_only_tools:  # mentioned in SKILL.md prose, deliberately not used (B9/F4; reconcile-skill-tools honors this)
  - Task  # 'Task subagent' prose in example prompts; dispatch is via Agent
