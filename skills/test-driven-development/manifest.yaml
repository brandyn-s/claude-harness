id: test-driven-development
type: skill
description: "Enforce red-green-refactor TDD discipline with five-step cycle: RED, DOMAIN, GREEN, DOMAIN, COMMIT."
category: operations
requires_tools:
  - Bash
  - Read
  - Write
  - Edit
  - AskUserQuestion
requires_topics: []
requires_rules:
  - tdd-quality
  - tdd-mutation-testing
requires_skills: []
requires_auth: []
input_contract:
  parameters:
    feature:
      type: string
      required: false
      description: "Feature or test file to implement with TDD"
  scope_from: argument
output_contract:
  produces: [test_files, implementation_files, commit_history]
  format: git_commits
side_effects: [writes_files, creates_commits]
execution_context: main_thread
auth_constraint: any
estimated_turns: "10-30"
preconditions:
  - test_framework_configured
guardrails: []
threat_model: writes_local
