id: mega-capture
type: skill
description: "Compaction-recovery front-end for /capture (the capture analog of mega-distill): streams a large or auto-compacted session transcript (>=1 compaction boundary, >5000 lines, or >15MB), condenses it to a chronological signal slice via the reused transcript_condense.py, enumerates EVERY distinct capturable theme across the whole session arc into a coverage ledger (coverage-complete / anti-truncation — no theme dropped for living in the compacted-away head), then routes each theme through /capture's normal judgment (match-to-topic, dedup, contradiction gate, resolution sweep, finalize gate) and auto-ships, so strategic knowledge from the lost ~90% reaches the KB. Coverage is breadth across themes; consolidation still applies within a theme (NOT a per-occurrence census). Entry count scales to theme count; a theme over 2500c splits, never truncates."
category: maintenance

requires_tools:
  - "Bash"
  - "Read"
  - "Glob"
  - "Grep"
  - "Skill"
  - "mcp__claude_platform__count_message_tokens"
  - "AskUserQuestion"
requires_topics: []
requires_rules: []
requires_skills:
  - capture
  - mega-distill
  - ship
requires_auth: []

input_contract:
  parameters:
    transcript_path: "optional — path to a session .jsonl; defaults to current session"
    max_tokens: "optional — per-slice-part token budget (default 180000); splitter prefers compaction boundaries and falls back to diagnostic-record boundaries"
  scope_from: argument
output_contract:
  produces: [condensed_signal_slice, condense_manifest, coverage_ledger, capture_kb_entries]
  format: text_and_markdown

side_effects: [writes_files, modifies_memory, creates_pr, pushes_to_remote]
execution_context: main_thread
auth_constraint: any
estimated_turns: "8-20"

preconditions:
  - "Transcript file exists and is large/compacted (Step 0 size gate routes small sessions to /capture)"
  - "python3 available for the deterministic condense helper"
guardrails: []
threat_model: reads_transcript_writes_tmp_and_kb
