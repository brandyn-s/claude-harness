id: brainstorm
type: skill
description: "Explores user intent, requirements, and design before implementation. Gathers evidence from codebase and memory before asking questions, proposes multiple approaches, and produces a design doc."
category: planning

requires_tools:
  - Bash
  - Read
  - Write
  - Grep
  - Glob
  - "mcp__memory-search__memory_search"
  - "AskUserQuestion"
requires_topics: []
requires_rules: []
requires_skills: []
requires_auth: []

input_contract:
  parameters:
    problem:
      type: string
      required: false
      description: "Problem or feature to design"
  scope_from: argument
output_contract:
  produces: [design_document, approach_comparison, implementation_plan_trigger]
  format: markdown_report

side_effects: [writes_files]
execution_context: main_thread
auth_constraint: any
estimated_turns: "8-20"

preconditions: []
guardrails: []
threat_model: writes_local
