id: scout-skills
type: skill
description: "Mine Context7 skills registry for transferable patterns -- search, fetch SKILL.md files, compare side-by-side, and incorporate additive patterns."
category: knowledge
requires_tools:
  - Bash
  - Read
  - Edit
  - Skill
  - AskUserQuestion
requires_topics: []
requires_rules:
  - compare-by-need
  - check-before-change
requires_skills:
  - ship
requires_auth: []
input_contract:
  parameters:
    category:
      type: string
      required: false
      description: "Optional category focus (e.g. security, testing, rust)"
  scope_from: argument
output_contract:
  produces: [search_results, findings_report, incorporated_patterns, ship_summary]
  format: markdown_report
side_effects: [modifies_skill_files, creates_pr]
execution_context: main_thread
auth_constraint: main_thread_only
estimated_turns: "25-60"
preconditions: []
guardrails: []
threat_model: writes_local
