      command: |
        import this_module_definitely_does_not_exist_audit_arch_xyzzy

  - skill: error-pathway
    code: PY_NAME_ERR
    severity: drift
    label: behavior-fix
    description: python snippet with NameError (typo) → ERROR (instrument failure)
    expected_status: ERROR
    reproducer:
      type: python
      command: |
        some_undefined_variable_audit_arch_xyzzy

  # Control: intentional raise stays STILL-FIRES
  - skill: error-pathway
    code: PY_RAISE_CONTROL
    severity: drift
    label: behavior-fix
    description: python intentional raise (RuntimeError) stays STILL-FIRES
    expected_fires: true
    reproducer:
      type: python
      command: |
        raise RuntimeError("architecture predicate fired")

  # Control: grep no-match stays STALE (not ERROR)
  - skill: error-pathway
    code: GREP_NOMATCH_CONTROL
    severity: drift
    label: behavior-fix
    description: grep with no match stays STALE — predicate result not error
    expected_fires: false
    reproducer:
