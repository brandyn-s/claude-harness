# Calibration set for the audit-architecture oracle.
#
# Uses the same oracle infrastructure as audit-skill: labeled findings
# with deterministic reproducers pointing into calibration fixtures
# (true_fixture/ = has architecture bugs; false_fixture/ = correct).
#
# TPR = correct STILL-FIRES on expected_fires: true / total expected_fires: true
# TNR = correct STALE on expected_fires: false / total expected_fires: false
#
# Floor: TPR >= 0.95, TNR >= 0.80 (same as audit-skill SPEC.md).
# ERROR-pathway TPR >= 1.00 (instruments must not silently produce STALE
# on a broken reproducer — same contract as audit-skill PR #979/#981).
#
# Re-run: pytest skills/audit-architecture/tests/test_audit_architecture_calibration.py -q
# Fixture roots: skills/audit-architecture/tests/golden-findings/calibration/

findings:
  # ===== 10 known-true (expected_fires: true) =====

  - skill: true-fixture
    code: R3
    severity: drift
    label: behavior-fix
    description: bad-settings.json is not valid JSON — config syntax error
    expected_fires: true
    reproducer:
      type: bash
      command: |
        python3 -c "import json; json.load(open('skills/audit-architecture/tests/golden-findings/calibration/true_fixture/bad-settings.json'))" 2>/dev/null
      expected_exit: 1

  - skill: true-fixture
    code: R2
    severity: drift
    label: behavior-fix
    description: nonexistent-server.py referenced in true_fixture/mcp.json does not exist
    expected_fires: true
    reproducer:
      type: file_missing
      path: /nonexistent/path/to/server.py

  - skill: true-fixture
    code: D4
    severity: info
    label: doc-fix
    description: documented-phantom appears in ARCHITECTURE.md but not in mcp.json
    expected_fires: true
    reproducer:
      type: bash
      command: |
        grep -q 'documented-phantom' skills/audit-architecture/tests/golden-findings/calibration/true_fixture/ARCHITECTURE.md && \
          ! grep -q 'documented-phantom' skills/audit-architecture/tests/golden-findings/calibration/true_fixture/mcp.json
      expected_exit: 0

  - skill: true-fixture
    code: D5
    severity: info
    label: doc-fix
    description: phantom-server is in mcp.json but absent from ARCHITECTURE.md
    expected_fires: true
    reproducer:
      type: bash
      command: |
        grep -q 'phantom-server' skills/audit-architecture/tests/golden-findings/calibration/true_fixture/mcp.json && \
          ! grep -q 'phantom-server' skills/audit-architecture/tests/golden-findings/calibration/true_fixture/ARCHITECTURE.md
      expected_exit: 0

  - skill: true-fixture
    code: C2
    severity: drift
    label: behavior-fix
    description: phantom-server has no routing rule in true_fixture/routing-rules.json
    expected_fires: true
    reproducer:
      type: grep_absent
      command: |
        grep -q 'phantom-server' skills/audit-architecture/tests/golden-findings/calibration/true_fixture/routing-rules.json

  - skill: true-fixture
    code: D3
    severity: info
    label: doc-fix
    description: ARCHITECTURE.md claims 99 MCP servers — far more than actually in mcp.json
    expected_fires: true
