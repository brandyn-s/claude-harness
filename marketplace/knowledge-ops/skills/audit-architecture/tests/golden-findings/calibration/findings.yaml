      command: |
        this-command-definitely-does-not-exist-audit-arch-xyzzy arg1 arg2
      expected_exit: 0

  - skill: error-pathway
    code: BASH_SIGNAL_KILL
    severity: drift
    label: behavior-fix
    description: bash subprocess killed by signal → ERROR (rc>=128)
    expected_status: ERROR
    reproducer:
      type: bash
      command: |
        bash -c 'kill -KILL $$'
      expected_exit: 0

  # Control: expected_exit=127 explicitly testing command-absence is STILL-FIRES
  - skill: error-pathway
    code: BASH_EXPECTED_127_CONTROL
    severity: drift
    label: behavior-fix
    description: bash with expected_exit=127 testing command-absence stays STILL-FIRES
    expected_fires: true
    reproducer:
      type: bash
      command: |
        this-command-definitely-does-not-exist-audit-arch-xyzzy
      expected_exit: 127

  # Control: rc=0 matching expected_exit=0 stays STILL-FIRES
  - skill: error-pathway
