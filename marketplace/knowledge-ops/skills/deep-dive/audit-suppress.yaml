suppressions:
  - code: D4
    target: "~/.claude/agent-memory/rules/web-search-preference.md"
    reason: |
      Same deployment-install convention as the G1 entries below. The source
      lives at /home/user/claude-config/agent-memory/rules/web-search-preference.md
      and is referenced by gather-intel, gather-research, gather-claude, gather-repos,
