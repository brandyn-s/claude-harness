      deployed-copy path with an explicit "if absent, read source-repo copy"
      fallback (Phase 2 Step 4), so the skill behaves correctly when the deploy
      path is missing. Fix at the install layer, not in deep-dive.
  - code: G1
    target: "skills/_shared/output-grounding.md"
    reason: |
      The path follows the architecture-wide deployed-path convention used by
      many skills (brainstorm, build-measurement-harness, garden, healthcheck,
      etc.). The file exists at skills/_shared/output-grounding.md (relocated 2026-08-26)
      in source. Whether ~/.claude/rules/ is populated depends on the install
      symlink — this is a deployment-install gap, not a deep-dive-specific bug.
      Per the audit-context note in the original finding: "the discrepancy may
      be a per-host install gap rather than a deep-dive bug."
  - code: G1
    target: "~/.claude/ARCHITECTURE.md"
    reason: |
      Same deployed-path convention as ~/.claude/rules/. The file exists at
      /home/user/claude-config/ARCHITECTURE.md in source. Several other skills
