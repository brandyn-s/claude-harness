name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements-dev.txt

      # Run per directory, not once from the root. A single root-level pytest
      # cannot work here: test modules import their own conftest by name (which
      # needs prepend import mode), and two test files share a basename (which
      # prepend mode cannot collect together). See scripts/run-tests.py.
      #
      # The runner exits non-zero on any failing directory AND on a run that
      # collected zero tests, so a suite that silently stops discovering
      # anything cannot report success.
      # Prove the baseline gate fires before trusting the run it guards. It is
      # otherwise only reachable through the full ~10-minute sweep, so it would
      # never be exercised deliberately.
      - name: Self-test the known-failing gate
        run: python3 scripts/run-tests.py --selftest

      # Restores the gate the source repo had and this export lost. Its step name
      # there was literally "Validate manifests (dangling refs, dangling routes,
      # missing sources)" -- and dropping it is why 17 dangling routes were live in
      # hooks/skill-rules.json with nothing complaining.
      - name: Validate the manifest graph
        run: python3 manifests/compile.py --root . --check --strict-semantic --no-reindex

      # Prove that gate can fail. A validator nobody has watched reject anything is
      # a hypothesis; this one is only reachable by running it deliberately.
      - name: Prove the manifest gate fires
        run: |
          set -euo pipefail
          cp hooks/skill-rules.json /tmp/sr.bak
          python3 - <<'EOF'
          import json
          p = "hooks/skill-rules.json"
          d = json.load(open(p, encoding="utf-8"))
          d["rules"].append({"pattern": "zzz-control", "skill": "no-such-skill-control",
                             "agent": None, "desc": "drift control", "priority": "low"})
          json.dump(d, open(p, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          EOF
          if python3 manifests/compile.py --root . --check --no-reindex >/dev/null 2>&1; then
            cp /tmp/sr.bak hooks/skill-rules.json
            echo "::error::manifest gate did NOT reject a dangling route - it is vacuous"
            exit 1
          fi
          cp /tmp/sr.bak hooks/skill-rules.json
          python3 manifests/compile.py --root . --check --no-reindex >/dev/null
          echo "manifest gate fires on a dangling route, and is clean after restore"

      - name: Run the suite
        run: python3 scripts/run-tests.py --timeout 600
