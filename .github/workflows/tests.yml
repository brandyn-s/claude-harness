name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: |
          set -euo pipefail
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements-dev.txt

      # Run per directory, not once from the root. A single root-level pytest
      # cannot work here: test modules import their own conftest by name (which
      # needs prepend import mode), and two test files share a basename (which
      # prepend mode cannot collect together). See scripts/run-tests.py.
      #
      # The runner exits non-zero on any failing directory AND on a run that
      # collected zero tests, so a suite that silently stops discovering
      # anything cannot report success.
      # Restores the gate the source repo had and this export lost; without it,
      # dangling manifest references accumulated with nothing complaining.
      - name: Validate the manifest graph
        run: python3 manifests/compile.py --root . --check --strict-semantic --no-reindex
      - name: Prove the manifest validator's detectors still fire
        run: python3 manifests/compile.py --self-test --root .

      - name: Validate hook and test target paths
        run: python3 scripts/validate-hook-paths.py

      # Prove that gate can fail. A validator nobody has watched reject anything is
      # a hypothesis; this one is only reachable by running it deliberately. The
      # control plants a hook manifest whose requires_rules names a rule that does
      # not exist (a DANGLING reference), then removes it and re-runs clean.
      - name: Prove the manifest gate fires
        run: |
          set -euo pipefail
          control=hooks/manifests/zzz-drift-control.yaml
          test ! -e "$control"
          printf '%s\n' \
            'id: zzz-drift-control' \
            'type: hook' \
            'event: PreToolUse' \
            'matcher: "Bash"' \
            'description: "CI drift control; never committed"' \
            'requires_rules:' \
            '  - no-such-rule-control' > "$control"
          if python3 manifests/compile.py --root . --check --no-reindex >/dev/null 2>&1; then
            rm -f "$control"
            echo "::error::manifest gate did NOT reject a dangling reference - it is vacuous"
            exit 1
          fi
          rm -f "$control"
          python3 manifests/compile.py --root . --check --no-reindex >/dev/null
          echo "manifest gate fires on a dangling reference, and is clean after removal"

      - name: Run the suite
        run: python3 scripts/run-tests.py --timeout 600
