id: output-secret-redact
type: hook
event: PostToolUse
matcher: "Bash"
if_condition: "tool output contains a high-confidence secret pattern (structured prefix or PEM header)"
action_type: fixer
description: "Redacts high-confidence secrets from tool OUTPUT before the model reads them, replacing only the secret substring with a [REDACTED:<type>] marker and preserving surrounding output. Defense-in-depth BELOW credential-guard (which blocks reading secret FILES) and the sandbox denyRead globs — a tool's output can surface a secret that never touched a denied path (env dumps, cloud-CLI output, a git remote with an embedded token)."
enforces:
  - platform-constraints
blocks_patterns: []
injects: null
modifies: tool_output
depends_on_files: []
depends_on_env: []
exit_codes:
  "0": "Always — fail-open by design. No secret found, an unrecognized output shape, or any error exits 0 leaving output unmodified."
output_format: json
notes: |
  Sanitizes the CONTEXT and logged transcript only — the tool has already run.
  Read tool_response field names are undocumented and updatedToolOutput silently
  falls back to the original on a shape mismatch, so string LEAVES are recursed
  and masked in place rather than hand-constructing a guessed object. A real
  redaction emits a systemMessage, making a silent shape-mismatch detectable.
  Keep SECRET_PATTERNS in sync with the sibling redactor patterns.
incidents:
  - date: "2026-07-19"
    summary: "Fleet replay over claude_code_tool_io traces (2026-07-13..19): of 55 real secret-bearing tool outputs in one week, Bash carried 25 (45%) and Read carried 23 (42%) — a Bash-only redactor left the majority unredacted. Extending to Read lifts coverage to ~87%. MCP measured 0 in-window (UNCHARTED, covered defensively). Write output intentionally NOT redacted — its content originated from the model."
    turns_wasted: 0
    category: security
  - date: "2026-07-24"
    summary: "Manifest absent since authoring — surfaced by the session-start manifest-coverage check (195/203)"
    turns_wasted: 0
    category: drift
