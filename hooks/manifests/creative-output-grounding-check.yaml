id: creative-output-grounding-check
type: hook
event: PostToolUse
matcher: "Skill"
if_condition: null
action_type: injector
description: "When a substantive creative-discovery Skill tool response is present, scans that payload for confidence, provenance, and counterfactual signals and injects a warning when missing; it does not grade the later final answer."
enforces: []
blocks_patterns: []
injects: "systemMessage warning when an available substantive Skill response lacks output-grounding signals"
modifies: null
depends_on_files: []
depends_on_env: []
exit_codes:
  "0": "always (non-blocking, advisory only)"
output_format: json
incidents: []
