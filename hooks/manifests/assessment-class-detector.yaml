id: assessment-class-detector
type: hook
event: UserPromptSubmit
matcher: ""
if_condition: null
action_type: injector
description: "Detects assessment-class user prompts (audit, critique, refute, objective-thoughts) and injects guidance to apply symmetric-evidentiary-burden + run /interview before publishing refutations of 2+ points."
enforces:
  - symmetric-evidentiary-burden
  - uncharted-vs-refuted
blocks_patterns: []
injects: assessment_class_guidance
modifies: null
depends_on_files:
  - rules/symmetric-evidentiary-burden.md
  - rules/uncharted-vs-refuted.md
  - skills/gather-research/references/citation-domain-freshness.md
depends_on_env: []
exit_codes:
  "0": "Continue (with or without additionalContext)"
output_format: json
incidents:
  - chat_audit_4_of_7_refutations_reversed_2026_04_29
