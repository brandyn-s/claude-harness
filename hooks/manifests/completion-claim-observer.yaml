id: completion-claim-observer
type: hook
event: Stop
matcher: null
if_condition: null
action_type: observe
description: "Shadow-mode observer: records whether a completion claim carried verification evidence. Never blocks."
enforces: []
blocks_patterns: []
injects: null
modifies: null
depends_on_files: []
depends_on_env: []
exit_codes:
  "0": "Always. This hook never blocks by design."
output_format: none
fail_posture: fail-open
incidents: []
notes: >
  Deliberately declares `enforces: []` and does NOT claim to enforce
  verify-effectiveness. It measures the gap; it does not close it. Claiming
  enforcement here would put a false edge into the enforcement graph the
  companion change to manifests/compile.py exists to keep honest.
