id: prompt-secret-scan
type: hook
event: UserPromptSubmit
matcher: ""
if_condition: null
action_type: guard
description: "Scans user prompts for accidentally pasted secrets or credentials."
enforces:
  - security-confirmations
blocks_patterns:
  - api_keys
  - passwords
  - tokens
injects: null
modifies: null
depends_on_files: []
depends_on_env: []
exit_codes:
  "0": "No secrets detected"
  "2": "Blocked: secret detected in prompt"
output_format: plaintext
incidents: []
