id: xlsx-to-md
type: hook
event: PreToolUse
matcher: "Read"
if_condition: "Read(*.xlsx)"
action_type: fixer
description: "Converts Excel .xlsx workbooks to Markdown (one table per sheet) when an .xlsx file is read. Requires openpyxl in target Python."
enforces: []
blocks_patterns: []
injects: null
modifies: read_output
depends_on_files: []
depends_on_env:
  - PYTHON_EXE
exit_codes:
  "0": "Not an .xlsx file, conversion failed (fallback to native Read), or cached .md consumed"
  "2": "Conversion succeeded; Read blocked with redirect to cached .md"
output_format: markdown
incidents: []
