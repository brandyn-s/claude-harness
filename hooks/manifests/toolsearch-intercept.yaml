id: toolsearch-intercept
type: hook
event: PreToolUse
matcher: "ToolSearch"
if_condition: null
action_type: logger
description: "Telemetry-only ToolSearch query logger (demoted from bare-keyword blocker 2026-06-12: Fable 5 recompute measured 0/55 clean-input bare keywords, and the prior 16.2% keep-evidence was the hook's own test fixtures contaminating this log). Appends query|max_results to ~/.claude/debug/toolsearch-queries.log; skips entries when CLAUDE_HOOK_TEST=1 so test runs never pollute the production instrument."
enforces: []
blocks_patterns: []
injects: null
modifies: null
depends_on_files: []
depends_on_env:
  - CLAUDE_HOOK_TEST
exit_codes:
  "0": "always (telemetry only — never blocks)"
output_format: none
incidents:
  - date: "2026-06-12"
    summary: "Fable 5 recurrence recompute: 21/21 bare-keyword log entries were the hook's own unit-test fixtures (read / foo bar / crowdstrike triplets); clean transcript inputs showed 0/55 — blocking demoted, provenance guard added"
    turns_wasted: 0
    category: telemetry-contamination
