id: symmetric-evidentiary-burden
type: rule
description: "Audits and refutations require the same multi-source 2024+ bar as the claims they assess. Single-source counter-evidence is preliminary signal, not refutation."
applies_to:
  - audit_assessment
  - critique_review
  - refutation_writing
  - claim_verification
  - llm_behavior_claims
trigger_conditions:
  - user_asks_objective_assessment
  - user_asks_audit_or_critique
  - drafting_refutation_of_proposal
  - llm_era_behavioral_claim
required_actions:
  - identify_claims_explicitly
  - apply_symmetric_evidence_depth
  - distinguish_refuted_contested_uncharted_supported
  - cite_each_refutation
  - verify_citation_domain_and_era_match
  - run_interview_when_refuting_2_or_more_points
prohibited_actions:
  - single_source_refutation_presented_as_consensus
  - pre_llm_citation_for_llm_behavioral_claim
  - asserted_refutation_without_citation
  - confident_refutation_without_corroboration
enforcement_coverage: none
incidents:
  - chat_audit_4_of_7_refutations_reversed_2026_04_29
  - becattini_2019_pre_llm_cited_for_llm_distance_2026_04_29
  - dada_surrealism_uncited_assertion_2026_04_29
created_date: "2026-04-29"
last_validated: "2026-04-29"
