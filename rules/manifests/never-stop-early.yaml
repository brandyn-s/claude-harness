id: never-stop-early
type: rule
description: "Continue incomplete work while useful progress is possible; checkpoint and hand off durably only at a real runtime or authority boundary."
applies_to:
  - all_tasks
trigger_conditions:
  - tempted_to_suggest_new_session
  - task_incomplete
required_actions:
  - continue_working_until_complete
prohibited_actions:
  - suggesting_new_session
  - presenting_plan_without_executing
  - stopping_due_to_conversation_length
  - claiming_a_fixed_context_capacity_without_runtime_evidence
enforcement_coverage: none
incidents: []
created_date: "2026-03-15"
last_validated: "2026-04-15"
