id: output-grounding
type: rule
description: "Prompt-and-evaluation contract requiring calibrated uncertainty, provenance, and a counterfactual in knowledge-asymmetric creative-discovery outputs; the registered PostToolUse hook is advisory and does not grade the final answer."
applies_to:
  - creative_discovery
  - knowledge_asymmetric_collaboration
  - skill_output_format
trigger_conditions:
  - skill_invocation_scout_frontier
  - skill_invocation_brainstorm
  - skill_invocation_deep_dive
  - skill_invocation_refine
required_actions:
  - label_confidence_per_claim
  - cite_source_or_tag_INFERRED
  - offer_counterfactual_per_output
prohibited_actions:
  - strip_confidence_labels
  - rationale_text_without_provenance
  - omit_counterfactual_on_cross_domain_analogies
enforcement_coverage: none
incidents:
  - ai_scientist_v2_57_percent_false_data_2026
  - opus_4_7_kintal_t4_mode_collapse_2026
  - hyperpolation_ceiling_finding_2026
