id: verify-instrument-before-fix
type: rule
description: "When per-cell precision/recall analysis identifies a failure cell holding >=30% of failure mass, sample 3-5 edges from the cell and verify by direct source inspection BEFORE designing a fix. The cell may be an instrument artifact, not a real system failure."
applies_to:
  - "every contingency-table cell or 'dominant failure' finding"
  - "metric-plateau diagnosis where a failure cell has been identified"
  - "any 'fix shipped +Xpp' claim measured against an older baseline"
  - "plan baselines >24h old at execution time"
trigger_conditions:
  - "per-cell analysis identifies a dominant failure cell"
  - "F1/recall/precision low and recommendation list forming from sample inspection"
  - "fix measured against baseline produced by older instrument version"
  - "plan cites specific numbers (precision rates, null counts, mode counts) authored >24h ago"
required_actions:
  - "sample 3-5 edges from the failure cell at random"
  - "for each: open source at cited location and verify by direct inspection"
  - "classify each: REAL / INSTRUMENT / UNCLEAR"
  - ">= 3 of 5 INSTRUMENT -> fix lives in harness, not system. STOP. File harness bug, re-run."
  - "for shipped-fix +Xpp: confirm baseline generated by same instrument version as post-fix"
  - "re-run baseline measurements >24h old before designing fix; if divergent, document as Phase 5c terminal-doc trigger"
prohibited_actions:
  - "skip source inspection because 'the cell is obviously the right thing to fix'"
  - "estimate impact from hand-picked 10-sample inspection (vibes, not engineering)"
  - "promote 'fix +Xpp' claim when baseline used older instrument"
  - "execute plan with cited day-of-execution numbers without re-running baselines"
enforcement_coverage: none
incidents:
  - date: "2026-05-02"
    summary: "THEME D (PR #144 -> #145): F1 0.890 plateau, cell looked like 'cross-package-heuristic threshold too loose'; shipped tighter threshold against stale per-subset DBs; fresh DBs post-Janusian showed -2.9pp regression"
    turns_wasted: 5
    category: measurement
  - date: "2026-05-02"
    summary: "Four-in-a-row: cell-analysis surfaced instrument bug 4 sessions in a row (confidence labels uncalibrated, CBM QN format, runIncrementalPasses oracle drop, Loc-Bench class_hit metric-definition mismatch)"
    turns_wasted: 12
    category: measurement
  - date: "2026-05-10"
    summary: "Production-readiness plan: cited '100% null r.strategy' from /retro audit using wrong column name (r.strategy vs r.resolution_strategy); day-of-execution showed 6%; predicted lift ~95pp, delivered ~5pp"
    turns_wasted: 3
    category: measurement
created_date: "2026-05-02"
last_validated: "2026-05-12"
