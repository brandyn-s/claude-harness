id: complete-the-whole-instruction
type: rule
description: "The instruction is the unit of completion, not the PR. Do not let the boundary of a clean mergeable PR become the boundary of the instruction — the tractable half ships green and FEELS like completion while the hard/foundational half silently becomes 'next'."
applies_to:
  - "every multi-part instruction"
  - "every instruction with a tractable half and a hard/foundational half"
  - "every 'build/fix/wire X' where X spans more than one shippable PR"
  - "every claim of 'done'"
trigger_conditions:
  - "about to claim done / shipped / complete"
  - "a green PR merged but the instruction had more parts"
  - "impulse to ship the data/backend half now and the visible/UI half 'next'"
  - "evidence (design doc, measurement, source) puts the instruction's premise in question"
  - "forming a plan for a capability the repo has source-of-truth design docs for"
required_actions:
  - "read source-of-truth design docs (SPEC.md, design doc, original brief) BEFORE forming the plan — the code is the current state, the docs are the intended target"
  - "restate the full instruction as enumerated parts"
  - "name the hardest / most-foundational part explicitly, out loud, before building"
  - "run the completion gate before saying done: re-read the enumeration, confirm one real run crossed the seam the USER hits, check no part 'became next' without the user choosing it"
  - "surface a premise-threatening doubt immediately, before the next build"
prohibited_actions:
  - "claim completion when a merged PR satisfied only part of the instruction"
  - "split off the user-visible half without the user choosing that split"
  - "claim 'it works' from component-green (tests pass / it builds) without crossing the real seam"
  - "build past a premise the evidence has already put in question"
  - "cite volume of activity (N PRs, M tests) as evidence of completeness"
  - "outsource the completeness check to the user"
  - "form the plan from the code's current behavior when design docs exist"
enforced_by: []
enforcement_coverage: none
incidents:
  - date: "2026-06-29"
    summary: "Claudinator prompt/skill separation: shipped the DATA-layer tag as 'done'; the visible UI + skill-refine loop (the actual point) waited until the user said 'it doesn't look like that's been done'"
    turns_wasted: 4
    category: completeness
  - date: "2026-06-29"
    summary: "Judge fix: called assistant-prefill 'the canonical Bedrock technique' and shipped WITHOUT one live call; a smoke harness built to catch exactly this was not run — it failed EVERY call"
    turns_wasted: 3
    category: completeness
  - date: "2026-06-29"
    summary: "Golden sets: shipped 4 PRs of golden-set machinery while the repo's OWN design doc (TASK_UNIT.md) said the unit was wrong and named the replacement"
    turns_wasted: 6
    category: completeness
  - date: "2026-06-29"
    summary: "Experiments tab: inferred 'Experiments = findings' from the rendered code and RENAMED the tab, moving away from the SPEC's actual intent (a runnable battery catalog). User: 'review the initial .md files for the original intent'"
    turns_wasted: 3
    category: completeness
created_date: "2026-06-29"
last_validated: "2026-07-24"
