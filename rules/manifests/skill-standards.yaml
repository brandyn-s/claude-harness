id: skill-standards
type: rule
description: "Standards for skill creation -- required frontmatter fields, structure, examples, success criteria."
applies_to:
  - skill_creation
  - skill_modification
trigger_conditions:
  - creating_new_skill
  - modifying_skill_frontmatter
required_actions:
  - include_required_frontmatter
  - include_examples_section
  - include_success_criteria
prohibited_actions:
  - skills_without_examples
  - skills_without_success_criteria
enforcement_coverage: none
incidents: []
created_date: "2026-04-01"
last_validated: "2026-04-15"
